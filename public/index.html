<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service route explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --ink: #14212b;
      --muted: #5d6b79;
      --line: #dde3e9;
      --ground: #f3f5f7;
      --surface: #ffffff;
      --public: #2f6fed;
      --vuln: #d6403a;
      --db: #1c8c5e;
      --other: #6b7a89;
      --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      background: var(--ground);
    }
    :focus-visible { outline: 2px solid var(--public); outline-offset: 2px; }

    /* ---------- header / controls ---------- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px 14px;
    }
    .title-row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    #status { color: var(--muted); font-size: 13px; }
    #status.error { color: var(--vuln); font-weight: 500; }

    form { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { position: relative; cursor: pointer; }
    .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
    .chip span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 500;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip:hover span { border-color: var(--muted); }
    .chip input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chip input:checked + span::before { content: "\2713"; font-size: 12px; }
    .chip input:focus-visible + span { outline: 2px solid var(--public); outline-offset: 2px; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; font-weight: 500; color: var(--muted); }
    .field input {
      font: inherit;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
    }
    .actions { display: flex; gap: 8px; margin-left: auto; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }
    button.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
    button.ghost:hover { border-color: var(--muted); }
    button:disabled { opacity: 0.5; cursor: wait; }

    /* ---------- main layout ---------- */
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 380px; }
    .graph {
      position: relative;
      min-height: 0;
      background-color: var(--ground);
      background-image: radial-gradient(#cdd5dd 1px, transparent 1px);
      background-size: 18px 18px;
    }
    #network { width: 100%; height: 100%; min-height: 480px; }
    .legend {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: flex;
      gap: 14px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; }

    /* ---------- side panel ---------- */
    aside {
      background: var(--surface);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .count { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .link-btn {
      padding: 2px 4px;
      border: none;
      background: none;
      color: var(--public);
      font-weight: 500;
    }
    .scroll { overflow-y: auto; padding: 14px 18px 20px; flex: 1; }

    #details {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--ground);
    }
    #details.on { display: block; }
    #details .name { font-weight: 700; font-size: 15px; }
    #details .role { color: var(--muted); margin-top: 2px; }
    .vuln {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 3px solid var(--vuln);
      border-radius: 4px;
      background: #fff;
      word-break: break-word;
    }
    .vuln b { color: var(--vuln); }
    .vuln small { display: block; color: var(--muted); margin-top: 2px; }

    .route {
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      background: var(--surface);
    }
    .route:hover { border-color: var(--muted); }
    .route.active { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .route .ends { font-weight: 600; word-break: break-word; }
    .strip { display: flex; align-items: center; margin: 8px 0 6px; }
    .pip { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .strip .bar { flex: 1; height: 2px; background: var(--line); min-width: 3px; }
    .route .meta { font-size: 12px; color: var(--muted); }
    .route .meta .warn { color: var(--vuln); font-weight: 500; margin-left: 10px; }
    .route .path { display: none; margin-top: 8px; font-size: 12.5px; line-height: 1.5; word-break: break-word; }
    .route.active .path { display: block; }
    .path .bad { color: var(--vuln); font-weight: 600; }
    .hint { color: var(--muted); line-height: 1.5; }
    .empty { padding: 14px; border: 1px dashed var(--line); border-radius: 10px; line-height: 1.5; }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
      aside { border-left: none; border-top: 1px solid var(--line); }
      .actions { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .chip span { transition: none; } }
  </style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Service route explorer</h1>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <form id="queryForm">
      <div class="chips" role="group" aria-label="Route conditions">
        <label class="chip" title="The first service is reachable from the internet">
          <input type="checkbox" id="publicStart" /><span>Starts at a public service</span>
        </label>
        <label class="chip" title="The last node is an RDS or SQL database">
          <input type="checkbox" id="endSink" /><span>Ends at a database</span>
        </label>
        <label class="chip" title="At least one service on the route has a known vulnerability">
          <input type="checkbox" id="hasVulnerability" /><span>Passes through a vulnerable service</span>
        </label>
      </div>
      <div class="field">
        <label for="startNode">Start service</label>
        <input type="text" id="startNode" list="nodeNames" placeholder="Any service" size="20" autocomplete="off" />
        <datalist id="nodeNames"></datalist>
      </div>
      <div class="field">
        <label for="maxDepth">Max steps</label>
        <input type="number" id="maxDepth" min="1" max="50" placeholder="20" style="width: 80px" />
      </div>
      <div class="actions">
        <button type="button" id="resetBtn" class="ghost">Reset</button>
        <button type="submit" id="queryBtn">Find routes</button>
      </div>
    </form>
  </header>

  <main>
    <div class="graph">
      <div id="network"></div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--public)"></i>Public</span>
        <span><i class="swatch" style="background:var(--vuln)"></i>Vulnerable</span>
        <span><i class="swatch" style="background:var(--db)"></i>Database</span>
        <span><i class="swatch" style="background:var(--other)"></i>Other</span>
      </div>
    </div>
    <aside>
      <div class="panel-head">
        <h2>Routes<span class="count" id="routeCount">0</span></h2>
        <button type="button" id="clearBtn" class="link-btn" hidden>Clear highlight</button>
      </div>
      <div class="scroll">
        <div id="details"></div>
        <div id="routesList" class="hint">Choose what to look for above, then select Find routes. Click a service on the map to see its details.</div>
      </div>
    </aside>
  </main>

  <script>
    const MAX_RENDERED_ROUTES = 200;
    const COLORS = {
      public: { bg: "#e8f0ff", border: "#2f6fed" },
      vuln: { bg: "#fdeceb", border: "#d6403a" },
      db: { bg: "#e5f5ed", border: "#1c8c5e" },
      other: { bg: "#f1f4f7", border: "#6b7a89" },
    };
    const FILTER_TEXT = {
      publicStart: "starts at a public service",
      endSink: "ends at a database",
      hasVulnerability: "passes through a vulnerable service",
    };

    const $ = (id) => document.getElementById(id);
    const container = $("network");
    const statusEl = $("status");
    const routesListEl = $("routesList");
    const detailsEl = $("details");
    const queryBtn = $("queryBtn");
    const resetBtn = $("resetBtn");
    const clearBtn = $("clearBtn");

    let network = null, visNodes = null, visEdges = null;
    let currentNodes = [], currentEdges = [], currentDimmed = false;
    let nodeByName = new Map(), currentRoutes = [], fullGraph = null, controller = null;

    // ---------- helpers ----------

    async function fetchJson(url, signal) {
      const res = await fetch(url, { signal });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function setStatus(text, isError = false) {
      statusEl.className = isError ? "error" : "";
      statusEl.textContent = text;
    }

    function setBusy(busy) {
      queryBtn.disabled = busy;
      resetBtn.disabled = busy;
    }

    const isVulnerable = (n) => Array.isArray(n?.vulnerabilities) && n.vulnerabilities.length > 0;

    function nodeType(n) {
      const kind = String(n?.kind || "").toLowerCase();
      const engine = String(n?.metadata?.engine || "").toLowerCase();
      const sink = kind === "rds" || kind === "sql" ||
        ["postgres", "mysql", "mariadb", "sqlserver", "oracle"].some((e) => engine.includes(e));
      if (sink) return "db";
      if (isVulnerable(n)) return "vuln";
      if (n?.kind === "service" && n.publicExposed) return "public";
      return "other";
    }

    // ---------- graph ----------

    function nodeItem(node, dimmed) {
      const c = COLORS[nodeType(node)];
      return {
        id: node.name,
        label: node.name,
        shape: "box",
        margin: 8,
        shapeProperties: { borderRadius: 7 },
        borderWidth: dimmed ? 1 : 1.5,
        color: dimmed
          ? { background: "#f7f9fa", border: "#d5dce3" }
          : { background: c.bg, border: c.border, highlight: { background: c.bg, border: c.border } },
        font: { color: dimmed ? "#9aa7b4" : "#14212b", size: 13, face: "Schibsted Grotesk, system-ui, sans-serif" },
      };
    }

    function edgeItem(edge, dimmed, onPath) {
      return {
        id: edge.id,
        from: edge.source,
        to: edge.target,
        arrows: { to: { enabled: true, scaleFactor: 0.6 } },
        width: onPath ? 3 : 1.2,
        color: { color: onPath ? "#14212b" : dimmed ? "#dde3e9" : "#a3afbb", inherit: false },
        smooth: { type: "cubicBezier", forceDirection: "horizontal", roundness: 0.45 },
      };
    }

    function applyHighlight(route) {
      if (!visNodes) return;
      const has = Array.isArray(route) && route.length > 0;
      const activeNodes = new Set(has ? route : []);
      const activeEdges = new Set();
      if (has) for (let i = 0; i < route.length - 1; i++) activeEdges.add(`${route[i]}->${route[i + 1]}`);

      visNodes.update(currentNodes.map((n) => nodeItem(n, has ? !activeNodes.has(n.name) : currentDimmed)));
      visEdges.update(currentEdges.map((e) => {
        const on = has && activeEdges.has(e.id);
        return edgeItem(e, has || currentDimmed, on);
      }));
      clearBtn.hidden = !has;
    }

    function renderGraph(nodes, edges, dimmed = false) {
      currentNodes = nodes;
      currentEdges = edges;
      currentDimmed = dimmed;
      nodeByName = new Map(nodes.map((n) => [n.name, n]));
      showDetails(null);
      clearBtn.hidden = true;

      if (network) network.destroy();
      visNodes = new vis.DataSet(nodes.map((n) => nodeItem(n, dimmed)));
      visEdges = new vis.DataSet(edges.map((e) => edgeItem(e, dimmed, false)));

      network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
        layout: { hierarchical: { direction: "LR", sortMethod: "directed", levelSeparation: 200, nodeSpacing: 46, treeSpacing: 60 } },
        physics: false,
        interaction: { hover: true, tooltipDelay: 200 },
      });
      network.fit();
      requestAnimationFrame(() => network && network.fit());
      network.on("click", (p) => showDetails(p.nodes.length ? nodeByName.get(p.nodes[0]) : null));
    }

    function showDetails(node) {
      detailsEl.replaceChildren();
      detailsEl.classList.toggle("on", Boolean(node));
      if (!node) return;

      const roles = { public: "Public service", vuln: "Service with vulnerabilities", db: "Database", other: node.kind === "service" ? "Internal service" : `Type: ${node.kind}` };
      detailsEl.appendChild(el("div", "name", node.name));
      detailsEl.appendChild(el("div", "role", roles[nodeType(node)] + (node.kind === "service" && node.publicExposed && isVulnerable(node) ? ", also public" : "")));

      if (!isVulnerable(node)) return;
      for (const v of node.vulnerabilities) {
        const box = el("div", "vuln");
        box.appendChild(el("b", "", String(v.severity || "unknown")));
        box.appendChild(document.createTextNode(` ${String(v.message || "").trim()}`));
        if (v.metadata?.cwe) box.appendChild(el("small", "", v.metadata.cwe));
        detailsEl.appendChild(box);
      }
    }

    // ---------- routes ----------

    function renderRoutes(routes, emptyText) {
      currentRoutes = routes;
      $("routeCount").textContent = String(routes.length);
      routesListEl.className = "";
      routesListEl.replaceChildren();

      if (routes.length === 0) {
        routesListEl.appendChild(el("div", "empty", emptyText || "No matching routes."));
        return;
      }

      const frag = document.createDocumentFragment();
      routes.slice(0, MAX_RENDERED_ROUTES).forEach((route, i) => {
        const item = el("div", "route");
        item.tabIndex = 0;
        item.dataset.index = String(i);
        item.appendChild(el("div", "ends", `${route[0]} \u2192 ${route[route.length - 1]}`));

        const strip = el("div", "strip");
        route.forEach((name, k) => {
          if (k) strip.appendChild(el("span", "bar"));
          const pip = el("span", "pip");
          pip.style.background = COLORS[nodeType(nodeByName.get(name))].border;
          pip.title = name;
          strip.appendChild(pip);
        });
        item.appendChild(strip);

        const steps = route.length - 1;
        const vulnCount = route.filter((n) => isVulnerable(nodeByName.get(n))).length;
        const meta = el("div", "meta", `${steps} step${steps === 1 ? "" : "s"}`);
        if (vulnCount) meta.appendChild(el("span", "warn", `${vulnCount} vulnerable`));
        item.appendChild(meta);

        const path = el("div", "path");
        route.forEach((name, k) => {
          if (k) path.appendChild(document.createTextNode(" \u2192 "));
          path.appendChild(el("span", isVulnerable(nodeByName.get(name)) ? "bad" : "", name));
        });
        item.appendChild(path);
        frag.appendChild(item);
      });
      routesListEl.appendChild(frag);

      if (routes.length > MAX_RENDERED_ROUTES) {
        routesListEl.appendChild(el("div", "hint", `Showing the first ${MAX_RENDERED_ROUTES} of ${routes.length} routes. Add more options to narrow the search.`));
      }
    }

    function selectRoute(item) {
      routesListEl.querySelectorAll(".route").forEach((r) => r.classList.remove("active"));
      item.classList.add("active");
      applyHighlight(currentRoutes[Number(item.dataset.index)]);
    }

    routesListEl.addEventListener("click", (e) => {
      const item = e.target.closest(".route");
      if (item) selectRoute(item);
    });
    routesListEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const item = e.target.closest(".route");
      if (item) { e.preventDefault(); selectRoute(item); }
    });

    // ---------- API calls ----------

    async function loadFullGraph() {
      controller?.abort();
      controller = new AbortController();
      const { signal } = controller;
      setStatus("Loading graph");
      setBusy(true);
      try {
        const data = await fetchJson("/graph", signal);
        fullGraph = { nodes: data.nodes || [], edges: data.edges || [] };
        const list = $("nodeNames");
        list.replaceChildren(...fullGraph.nodes.map((n) => Object.assign(document.createElement("option"), { value: n.name })));
        renderGraph(fullGraph.nodes, fullGraph.edges);
        currentRoutes = [];
        $("routeCount").textContent = "0";
        routesListEl.className = "hint";
        routesListEl.textContent = "Choose what to look for above, then select Find routes. Click a service on the map to see its details.";
        setStatus(`${fullGraph.nodes.length} services, ${fullGraph.edges.length} connections`);
      } catch (err) {
        if (err.name === "AbortError") return;
        setStatus(err.message, true);
      } finally {
        if (!signal.aborted) setBusy(false);
      }
    }

    async function queryRoutes() {
      const params = new URLSearchParams();
      for (const name of Object.keys(FILTER_TEXT)) if ($(name).checked) params.set(name, "true");
      const startNode = $("startNode").value.trim();
      const maxDepth = $("maxDepth").value.trim();
      if (startNode) params.set("startNode", startNode);
      if (maxDepth) params.set("maxDepth", maxDepth);

      if (!params.has("startNode") && !Object.keys(FILTER_TEXT).some((n) => params.has(n))) {
        setStatus("Choose at least one option or a start service.", true);
        return;
      }

      controller?.abort();
      controller = new AbortController();
      const { signal } = controller;
      setStatus("Searching");
      setBusy(true);
      try {
        const data = await fetchJson(`/routes?${params}`, signal);

        if (data.count === 0) {
          const base = fullGraph || { nodes: [], edges: [] };
          renderGraph(base.nodes, base.edges, true);
          const parts = Object.keys(FILTER_TEXT).filter((n) => params.has(n)).map((n) => FILTER_TEXT[n]);
          if (startNode) parts.unshift(`starts at ${startNode}`);
          renderRoutes([], `No route ${parts.join(" and ")}. Try turning one option off.`);
          setStatus("No routes found");
          return;
        }

        renderGraph(data.nodes || [], data.edges || []);
        renderRoutes(data.routes || []);
        setStatus(`${data.count} route${data.count === 1 ? "" : "s"} found`);
      } catch (err) {
        if (err.name === "AbortError") return;
        setStatus(err.message, true);
      } finally {
        if (!signal.aborted) setBusy(false);
      }
    }

    // ---------- events ----------

    $("queryForm").addEventListener("submit", (e) => { e.preventDefault(); queryRoutes(); });
    resetBtn.addEventListener("click", () => { $("queryForm").reset(); loadFullGraph(); });
    clearBtn.addEventListener("click", () => {
      routesListEl.querySelectorAll(".route").forEach((r) => r.classList.remove("active"));
      applyHighlight(null);
    });

    loadFullGraph();
  </script>
</body>
</html>
